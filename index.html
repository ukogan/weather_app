<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather with Privacy</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ============ SPLASH ============ -->
  <div id="splash-screen" class="screen splash">
    <!-- Deliberate exception to Modernist's grayscale rule: the subject of this
         photograph IS colour. It is the only colour image in the app. -->
    <div class="splash__photo">
      <img src="rainbow.png" alt="Rainbow over Emerald Hills" class="splash__img" />
    </div>
    <div class="splash__caption">
      <div class="splash__title-row">
        <span class="splash__mark"></span>
        <h1 class="splash__title">Weather with Privacy</h1>
      </div>
      <p class="splash__sub">National Weather Service data. No account, no tracking, no location leaving your phone.</p>
    </div>
    <div class="splash__footer">
      <div class="splash__track"><div class="splash__bar"></div></div>
      <div class="splash__status" id="splash-status">Fetching forecast</div>
    </div>
  </div>

  <!-- ============ FORECAST ============ -->
  <div id="forecast-screen" class="screen forecast" hidden></div>

  <!-- ============ LOCATION PICKER ============ -->
  <div id="location-screen" class="screen picker" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=20"></script>
</body>
</html>
